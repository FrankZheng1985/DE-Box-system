# ================================================
# GitHub Actions 自动部署工作流
# 德国Box运输管理系统 (EU-TMS)
# ================================================
#
# 触发条件: push 到 main 分支，或手动触发
#
# 部署流程:
#   1. 装依赖 → **四个包跑 ESLint（不过就在这里停，绝不碰生产）**
#   2. 在 GitHub Actions 中构建三个前端项目
#   3. 通过 SSH + rsync 上传构建产物和后端代码到服务器
#   4. 在服务器上安装后端依赖并重启 PM2 服务
#
# 需要配置的 GitHub Secrets:
#   - SSH_PRIVATE_KEY : SSH ed25519 私钥（用于免密登录服务器）
#   - SERVER_HOST     : 服务器 IP（47.83.241.117）
#   - SERVER_USER     : SSH 登录用户（root）
#
# 服务器目录结构:
#   /var/www/germany-box-system/
#   ├── admin/dist/              # 管理后台前端
#   ├── customer-portal/dist/    # 客户门户前端
#   ├── carrier-portal/dist/     # 承运商门户前端
#   ├── server/                  # 后端代码
#   └── deploy/                  # 部署配置
# ================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Production

    steps:
      # ========== 第一步：拉取代码 ==========
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 第二步：设置 Node.js ==========
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ========== 第三步：安装根依赖（workspace） ==========
      - name: Install Dependencies
        run: npm install

      # ========== 第四步：安装承运商门户依赖 ==========
      # ⚠️ carrier-portal 不在根 package.json 的 workspaces 里（只有 admin /
      #    customer-portal / server），所以上面那次根 npm install 装不到它的依赖，
      #    必须单独 npm ci。以前没暴露是因为它的依赖恰好和 admin 重合、
      #    被提升到根 node_modules 借到了；2026-08-03 加了 i18next 这个
      #    独有依赖后 CI 直接构建失败（踩坑 034）。
      #
      # 这一步提到构建之前，是为了让下面的 Lint 能覆盖到 carrier-portal。
      - name: Install Carrier Portal Dependencies
        run: cd carrier-portal && npm ci

      # ========== 第五步：代码规范检查（四个包）==========
      # 放在**所有构建和部署动作之前**：有问题就在这里停下，
      # 既省掉后面的构建时间，更重要的是绝不让不合规的代码碰到生产。
      #
      # 为什么必须接进 CI（踩坑 038）：三前端的 lint 配置 2026-08-04 就补齐了、
      # 后端 2026-08-06 补齐，但在此之前**CI 一个都不跑**——
      # 一个只有人想起来才手动执行的检查，等于不存在。
      #
      # ⚠️ 这一步失败会挡住生产部署（这正是它的意义）。
      #    真遇到紧急发布被 lint 卡住时，正确做法是修掉它，
      #    或对那一行加 `// eslint-disable-next-line <规则名> -- 理由`，
      #    **不要**为了赶时间把这一步删掉或改成 continue-on-error。
      - name: Lint All Packages
        run: |
          set -e
          for pkg in server admin customer-portal carrier-portal; do
            echo "──────── lint: $pkg ────────"
            (cd "$pkg" && npm run lint)
          done

      # ========== 第六步：构建三端 ==========
      - name: Build Admin Frontend
        run: cd admin && npm run build

      - name: Build Customer Portal
        run: cd customer-portal && npm run build

      - name: Build Carrier Portal
        run: cd carrier-portal && npm run build

      # ========== 第七步：配置 SSH ==========
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 自动信任服务器指纹，避免首次连接交互
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ========== 第八步：上传前端构建产物 ==========
      - name: Deploy Frontend Assets
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          REMOTE_DIR="/var/www/germany-box-system"

          echo ">>> 上传管理后台..."
          rsync -avz --delete -e "ssh ${SSH_OPTS}" \
            admin/dist/ \
            ${REMOTE}:${REMOTE_DIR}/admin/dist/

          echo ">>> 上传客户门户..."
          rsync -avz --delete -e "ssh ${SSH_OPTS}" \
            customer-portal/dist/ \
            ${REMOTE}:${REMOTE_DIR}/customer-portal/dist/

          echo ">>> 上传承运商门户..."
          rsync -avz --delete -e "ssh ${SSH_OPTS}" \
            carrier-portal/dist/ \
            ${REMOTE}:${REMOTE_DIR}/carrier-portal/dist/

      # ========== 第九步：上传后端代码 ==========
      - name: Deploy Server Code
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          REMOTE_DIR="/var/www/germany-box-system"

          echo ">>> 上传后端代码..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'uploads/' \
            --exclude '*.log' \
            -e "ssh ${SSH_OPTS}" \
            server/ \
            ${REMOTE}:${REMOTE_DIR}/server/

          echo ">>> 上传部署配置..."
          rsync -avz -e "ssh ${SSH_OPTS}" \
            deploy/ecosystem.config.cjs \
            ${REMOTE}:${REMOTE_DIR}/deploy/

      # ========== 第十步：安装依赖并重启服务 ==========
      - name: Install Dependencies & Restart Server
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"

          ssh ${SSH_OPTS} ${REMOTE} << 'DEPLOY_SCRIPT'
            set -e
            echo "=========================================="
            echo "  开始部署 - $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="

            cd /var/www/germany-box-system

            # 安装后端依赖
            echo ">>> 安装后端依赖..."
            cd server
            npm install --production
            cd ..

            # 重启 PM2 服务
            echo ">>> 重启后端服务..."
            if pm2 describe germany-box-server > /dev/null 2>&1; then
              pm2 reload germany-box-server --update-env
            else
              pm2 start deploy/ecosystem.config.cjs --env production
            fi

            # 重载 Nginx（确保配置正确）
            echo ">>> 重载 Nginx..."
            nginx -t && systemctl reload nginx

            echo "=========================================="
            echo "  部署完成 - $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="

            # 显示服务状态
            pm2 status
          DEPLOY_SCRIPT

      # ========== 第十一步：恢复官网主页 ==========
      - name: Restore Homepage
        run: |
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${REMOTE} \
            "cp /var/www/germany-box-system/homepage/index.html /var/www/germany-box-system/admin/dist/homepage.html"

      # ========== 第十二步：健康检查（失败会让整个部署红）==========
      #
      # 2026-08-06 重写。原来这一步有两个毛病，叠在一起让它彻底失去意义：
      #
      #   1. 两个分支都不 exit 非 0 —— 服务起不来它也照样绿，
      #      「CI 全绿」根本不能证明生产是活的（踩坑 042 的另一面）。
      #   2. 探的是 `http://IP/api/health`，而自 2026-08-02 启用 HTTPS 强制跳转后，
      #      这个地址一直返回 **301**。也就是说它**每次部署都在打印「警告 HTTP 301」**，
      #      只因为从不失败，没人发现。
      #
      # 所以不能只把 if 改成 exit 1 —— 那样每一次部署都会立刻开始失败。
      # 正确做法是同时修地址（-L 跟跳转 / -k 放行 IP 的自签名证书）。
      #
      # ⚠️ 这一步失败**不会自动回滚**：此时 rsync 和 PM2 重启都已经做完了。
      #    它是报警器不是保险丝 —— 红了说明生产可能已经坏了，要人立刻去看。
      - name: Health Check
        run: |
          set -u
          ORIGIN="https://${{ secrets.SERVER_HOST }}/api/health"   # 源站直连，绕开 DNS/CDN
          PUBLIC="https://kalunasped.com/api/health"               # 用户真正走的路径

          # 校验响应体而不只看状态码：nginx 返回一个陈旧页面同样是 200，
          # 只有 body 里带 "status":"ok" 才能证明 Node 应用本身在响应。
          probe() {
            curl -sS -k -L -m 15 "$1" 2>/dev/null | grep -q '"status":"ok"'
          }

          # PM2 reload 是渐进式的，新旧进程交替期间可能短暂不可用，
          # 所以退避重试而不是 sleep 一个拍脑袋的固定值。累计约 75 秒。
          # 注意用 if 而不是 `[ x ] && sleep`：后者在 wait=0 时整条返回非 0，
          # 将来若有人给这个 run 块加上 set -e，会在第一次循环就误中断。
          BACKOFF="3 5 8 12 15 15 15"
          echo ">>> 探测源站: $ORIGIN"
          ok=0; n=0
          for wait in 0 $BACKOFF; do
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            n=$((n + 1))
            if probe "$ORIGIN"; then ok=1; echo "源站健康检查通过（第 ${n} 次尝试）"; break; fi
            echo "    第 ${n} 次未就绪…"
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::源站健康检查失败：$ORIGIN 在约 75 秒内始终没有返回 status=ok"
            echo "--- 最后一次响应（截断）---"
            curl -sS -k -L -m 15 -w '\nHTTP %{http_code}\n' "$ORIGIN" 2>&1 | head -20 || true
            exit 1
          fi

          # 源站活着之后再看用户实际访问的域名。这一段同样是硬失败：
          # kalunasped.com 打不开 = 客户打不开，和源站坏了一样严重。
          echo ">>> 探测正式域名: $PUBLIC"
          ok=0; n=0
          for wait in 0 3 5 8 12; do
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            n=$((n + 1))
            if probe "$PUBLIC"; then ok=1; echo "正式域名健康检查通过（第 ${n} 次尝试）"; break; fi
            echo "    第 ${n} 次未就绪…"
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::正式域名健康检查失败：$PUBLIC 无法返回 status=ok（源站本身是好的，怀疑 DNS / 证书 / nginx 域名块）"
            curl -sS -L -m 15 -w '\nHTTP %{http_code}\n' "$PUBLIC" 2>&1 | head -20 || true
            exit 1
          fi

          echo "健康检查全部通过：源站与正式域名均返回 status=ok"

      # ========== 清理 SSH ==========
      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
