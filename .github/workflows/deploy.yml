# GitHub Actions 自动部署工作流
# 德国Box运输管理系统 - 自动部署到阿里云服务器

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Aliyun Server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=========================================="
            echo "  开始自动部署 - $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            
            # 进入项目目录
            cd /var/www/germany-box-system
            
            # 拉取最新代码
            echo ">>> 拉取最新代码..."
            git fetch origin main
            git reset --hard origin/main
            
            # 安装依赖
            echo ">>> 安装依赖..."
            npm install
            npm run install:all
            
            # 运行数据库迁移
            echo ">>> 运行数据库迁移..."
            cd server
            node scripts/init-db.js || echo "数据库迁移完成或已是最新"
            cd ..
            
            # 构建前端
            echo ">>> 构建管理后台..."
            cd admin && npm run build && cd ..
            
            echo ">>> 构建客户门户..."
            cd customer-portal && npm run build && cd ..
            
            # 重启后端服务
            echo ">>> 重启后端服务..."
            pm2 reload germany-box-server --update-env || pm2 start deploy/ecosystem.config.cjs --env production
            
            # 重载 Nginx
            echo ">>> 重载 Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "=========================================="
            echo "  部署完成 - $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            
            # 显示服务状态
            pm2 status
