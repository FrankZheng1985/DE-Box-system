<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU-TMS 欧洲运输管理系统 - 交互原型</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js" rel="prefetch">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --pri:#1F4E79; --priL:#2E75B6; --priLL:#D5E8F4;
  --acc:#4472C4; --accL:#7BA7D7;
  --bg:#F5F7FA; --white:#FFF; --text:#1A1A2E; --textS:#6B7280; --textL:#9CA3AF;
  --border:#E5E7EB; --borderL:#F3F4F6;
  --green:#10B981; --greenL:#D1FAE5; --red:#EF4444; --redL:#FEE2E2;
  --yellow:#F59E0B; --yellowL:#FEF3C7; --blue:#3B82F6; --blueL:#DBEAFE;
  --purple:#8B5CF6; --purpleL:#EDE9FE; --orange:#F97316; --orangeL:#FFEDD5;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif; background:var(--bg); color:var(--text); }
a { text-decoration:none; }

/* Layout */
.app { display:flex; height:100vh; overflow:hidden; }
.sidebar { width:220px; background:var(--pri); color:#fff; display:flex; flex-direction:column; flex-shrink:0; transition:width .2s; overflow:hidden; }
.sidebar.collapsed { width:60px; }
.sidebar-header { padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.1); display:flex; align-items:center; gap:10px; cursor:pointer; }
.sidebar.collapsed .sidebar-header { padding:16px 10px; justify-content:center; }
.sidebar-logo { font-size:15px; font-weight:700; white-space:nowrap; }
.sidebar.collapsed .sidebar-logo, .sidebar.collapsed .sidebar-footer, .sidebar.collapsed .menu-label { display:none; }
.sidebar-menu { flex:1; padding:10px 0; overflow-y:auto; }
.menu-item { display:flex; align-items:center; gap:12px; padding:10px 20px; cursor:pointer; font-size:13px; color:rgba(255,255,255,.7); border-left:3px solid transparent; transition:all .15s; white-space:nowrap; }
.sidebar.collapsed .menu-item { padding:10px 18px; justify-content:center; }
.menu-item:hover { background:rgba(255,255,255,.08); }
.menu-item.active { background:rgba(255,255,255,.15); border-left-color:#fff; color:#fff; }
.sidebar-footer { padding:14px 20px; border-top:1px solid rgba(255,255,255,.1); font-size:11px; color:rgba(255,255,255,.5); }

.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.header { height:54px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0; }
.role-switch { display:flex; gap:2px; background:var(--borderL); border-radius:7px; padding:4px 6px; }
.role-btn { padding:5px 12px; border:none; border-radius:5px; cursor:pointer; font-size:12px; font-weight:500; background:transparent; color:var(--textS); transition:all .15s; }
.role-btn.active { background:var(--pri); color:#fff; }
.header-right { display:flex; align-items:center; gap:16px; }
.avatar { width:30px; height:30px; border-radius:15px; background:var(--priLL); display:flex; align-items:center; justify-content:center; }
.notification-dot { position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:8px; background:var(--red); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; }

.content { flex:1; overflow:auto; padding:24px; }

/* Components */
.card { background:#fff; border-radius:10px; border:1px solid var(--border); padding:20px; margin-bottom:16px; }
.card-flush { padding:0; overflow:hidden; }

.stat-cards { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:24px; }
.stat-card { flex:1; min-width:160px; background:#fff; border-radius:10px; border:1px solid var(--border); padding:16px 20px; display:flex; align-items:center; gap:12px; }
.stat-icon { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-value { font-size:22px; font-weight:700; }
.stat-label { font-size:12px; color:var(--textS); }
.stat-sub { font-size:11px; color:var(--textL); }

.section-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.section-title h2 { font-size:18px; font-weight:700; }

.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:7px; border:1px solid var(--border); background:#fff; color:var(--text); font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; white-space:nowrap; }
.btn:hover { background:var(--borderL); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-pri { background:var(--pri); color:#fff; border-color:var(--pri); }
.btn-pri:hover { background:var(--priL); }

.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }

table { width:100%; border-collapse:collapse; }
th { padding:10px 12px; text-align:left; font-size:11px; font-weight:600; color:var(--textS); text-transform:uppercase; letter-spacing:.5px; border-bottom:2px solid var(--border); background:var(--borderL); }
td { padding:10px 12px; font-size:13px; border-bottom:1px solid var(--borderL); }
tr:hover td { background:rgba(68,114,196,.03); }
td.accent { font-weight:500; color:var(--acc); cursor:pointer; }
.icon-btn { padding:4px; border:none; background:none; cursor:pointer; display:inline-flex; }

.tabs { display:flex; gap:2px; margin-bottom:20px; border-bottom:2px solid var(--border); }
.tab { padding:10px 20px; border:none; background:none; cursor:pointer; font-size:13px; font-weight:400; color:var(--textS); border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
.tab.active { font-weight:600; color:var(--pri); border-bottom-color:var(--pri); }

.search-bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.search-input { flex:1; min-width:200px; position:relative; }
.search-input input { width:100%; padding:8px 12px 8px 32px; border-radius:7px; border:1px solid var(--border); font-size:13px; }
.search-input svg { position:absolute; left:10px; top:9px; color:var(--textL); }

.form-group { margin-bottom:14px; }
.form-label { font-size:12px; font-weight:500; color:var(--textS); margin-bottom:4px; display:block; }
.form-input, .form-select { width:100%; padding:8px 12px; border-radius:7px; border:1px solid var(--border); font-size:13px; color:var(--text); background:#fff; }
.form-textarea { width:100%; padding:8px 12px; border-radius:7px; border:1px solid var(--border); font-size:13px; min-height:80px; resize:vertical; }
.form-row { display:flex; gap:14px; }
.form-row > * { flex:1; }

.flex-row { display:flex; gap:16px; }
.flex-row > .flex-2 { flex:2; }
.flex-row > .flex-1 { flex:1; }

.info-pair { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--borderL); }
.info-pair .k { font-size:12px; color:var(--textS); }
.info-pair .v { font-size:12px; font-weight:500; }

.timeline-item { display:flex; gap:14px; margin-bottom:4px; }
.timeline-time { font-size:11px; color:var(--textL); width:80px; text-align:right; padding-top:2px; }
.timeline-dot { width:10px; height:10px; border-radius:5px; margin-top:3px; flex-shrink:0; }
.timeline-line { width:2px; height:28px; margin:2px auto 0; opacity:.5; }
.timeline-text { font-size:13px; }

.progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; }

.upload-zone { padding:40px; border:2px dashed var(--border); border-radius:8px; text-align:center; cursor:pointer; }
.upload-zone:hover { border-color:var(--acc); background:rgba(68,114,196,.02); }

.map-container { height:360px; background:linear-gradient(160deg,#d4e8d0,#b8d4b0,#a8c8a0); border-radius:8px; position:relative; overflow:hidden; }

.notif-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--borderL); }
.notif-item.unread { background:rgba(219,234,254,.25); margin:0 -20px; padding-left:20px; padding-right:20px; }
.notif-icon { width:36px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* Login */
.login-page { min-height:100vh; background:linear-gradient(135deg,var(--pri),var(--acc)); display:flex; align-items:center; justify-content:center; }
.login-box { width:420px; background:#fff; border-radius:16px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.login-title { text-align:center; margin-bottom:30px; }
.login-btn { width:100%; padding:12px; border-radius:8px; border:none; background:var(--pri); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
.login-btn:hover { background:var(--priL); }

/* Pagination */
.pagination { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
.page-btns { display:flex; gap:4px; }
.page-btn { padding:4px 10px; border:1px solid var(--border); border-radius:5px; background:#fff; cursor:pointer; font-size:12px; }
.page-btn.active { background:var(--pri); color:#fff; border-color:var(--pri); }

/* SVG icons inline */
.icon { width:18px; height:18px; display:inline-block; vertical-align:middle; }

/* Responsive table wrapper */
.table-wrap { overflow-x:auto; }

/* Bar chart */
.bar-chart { display:flex; gap:8px; flex-wrap:wrap; }
.bar-col { text-align:center; flex:1; min-width:70px; }
.bar-wrapper { height:100px; display:flex; align-items:flex-end; justify-content:center; margin-bottom:6px; }
.bar { width:36px; border-radius:4px 4px 0 0; opacity:.85; }

.todo-items .todo { padding:8px 0; border-bottom:1px solid var(--borderL); display:flex; align-items:center; gap:10px; cursor:pointer; }
.todo svg { flex-shrink:0; }
.todo span { font-size:13px; flex:1; }

.route-box { flex:1; padding:14px; border-radius:8px; }
.sticky { position:sticky; top:20px; }
</style>
</head>

function icon(name, size, color) {
  let s = icons[name] || '';
  if (size) s = s.replace(/width="\d+"/, `width="${size}"`).replace(/height="\d+"/, `height="${size}"`);
  if (color) s = s.replace(/stroke="currentColor"/g, `stroke="${color}"`).replace(/fill="currentColor"/g, `fill="${color}"`);
  return s;
}

// ===== HELPERS =====
function formGroup(label, content) { return `<div class="form-group"><label class="form-label">${label}</label>${content}</div>`; }
function input(label, opts={}) { return formGroup(label, `<input class="form-input" type="${opts.type||'text'}" placeholder="${opts.ph||''}" value="${opts.val||''}" readonly>`); }
function select(label, options) { return formGroup(label, `<select class="form-select">${options.map(o=>`<option>${o}</option>`).join('')}</select>`); }
function statCard(iconName, label, value, sub, color) {
  return `<div class="stat-card"><div class="stat-icon" style="background:${color}15">${icon(iconName,20,color)}</div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div></div>`;
}

    <div style="font-size:14px;font-weight:600;color:var(--pri);margin-bottom:14px">手动上报位置</div>
    ${select('选择运输任务',['EU-20260328-0001 (Munich → Paris)','EU-20260327-0003 (Stuttgart → Milan)'])}
    <div class="form-row">${input('当前城市',{ph:'如 Strasbourg'})}${select('国家',['France','Germany','Austria','Switzerland'])}</div>
    <div class="form-row">${input('纬度',{ph:'48.5734'})}${input('经度',{ph:'7.7521'})}</div>
    ${select('运输状态更新',['运输中 — 正常行驶','已到达装货地','已提货出发','已到达卸货地','已交付签收','异常停留'])}
    ${input('备注',{ph:'如有异常请说明'})}
    <button class="btn btn-pri" style="width:100%;justify-content:center">${icon('nav',15,'#fff')} 提交位置更新</button>
  </div></div>
  <div class="flex-1"><div class="card">
    <div style="font-size:14px;font-weight:600;color:var(--pri);margin-bottom:14px">API 自动上报设置</div>
    <div style="padding:14px;background:var(--greenL);border-radius:8px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">${icon('checkCircle',14,'var(--green)')}<span style="font-size:13px;font-weight:600;color:var(--green)">API 已连接</span></div>
      <div style="font-size:12px;color:var(--textS)">上次同步: 2026-03-29 14:32:00</div>
    </div>
    ${input('API 端点',{val:'https://api.speedtrans.de/gps/v1/positions'})}
    ${input('API Key',{val:'••••••••••••••••'})}
    ${select('上报频率',['每 5 分钟','每 15 分钟','每 30 分钟','每小时'])}
    <button class="btn btn-pri">保存配置</button>
  </div></div>
</div>`;

pages.cr_billing = () => `
<div class="section-title"><h2>费用结算</h2></div>
<div class="stat-cards">${statCard('credit','待收款','€4,700','','var(--orange)')}${statCard('checkCircle','已收款','€32,400','','var(--green)')}</div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>账单号</th><th>关联订单</th><th>路线</th><th>金额</th><th>状态</th><th>到期日</th></tr></thead><tbody>
  ${[['PAY-2026-0088','EU-..0001','Munich → Paris','€2,100','待收款','2026-04-28','var(--orange)','var(--orangeL)'],['PAY-2026-0085','EU-..0003','Stuttgart → Milan','€2,600','待收款','2026-04-25','var(--orange)','var(--orangeL)'],['PAY-2026-0082','EU-..0004','Hamburg → Barcelona','€3,100','已收款','2026-04-15','var(--green)','var(--greenL)']].map(([inv,od,rt,amt,st,due,sc,sb])=>`<tr><td class="accent">${inv}</td><td style="font-size:12px;color:var(--textS)">${od}</td><td style="font-size:12px;color:var(--textS)">${rt}</td><td style="font-weight:600">${amt}</td><td><span class="badge" style="color:${sc};background:${sb}">${st}</span></td><td style="font-size:12px;color:var(--textS)">${due}</td></tr>`).join('')}
</tbody></table></div></div>`;

// ===== RENDER =====
function render() {
  const {role, page, sidebarCollapsed} = state;
  if (page === 'login') { document.getElementById('app').innerHTML = pages.login(); return; }

  const menu = MENUS[role] || MENUS.operator;
  const roleName = role==='operator'?'运营管理员':role==='client'?'BMW AG':'SpeedTrans GmbH';
  const roleLabel = role==='operator'?'运营端':role==='client'?'客户端':'运输公司端';

  const sidebar = `
  <div class="sidebar${sidebarCollapsed?' collapsed':''}">
    <div class="sidebar-header" onclick="setState('sidebarCollapsed',!state.sidebarCollapsed)">${icon('truck',22,'#fff')}<span class="sidebar-logo">EU-TMS</span></div>
    <div class="sidebar-menu">
      ${menu.map(m=>`<div class="menu-item${page===m.id?' active':''}" onclick="setState('page','${m.id}')">${icon(m.icon,18)}<span class="menu-label">${m.label}</span></div>`).join('')}
    </div>
    <div class="sidebar-footer">EU Transport Management v1.1</div>
  </div>`;

  const header = `
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="role-switch">
        ${['operator','client','carrier'].map(r=>`<button class="role-btn${role===r?' active':''}" onclick="setState('role','${r}');setState('page','${r==='operator'?'dashboard':r==='client'?'c_dashboard':'cr_dashboard'}')">${r==='operator'?'运营端':r==='client'?'客户端':'运输公司端'}</button>`).join('')}
      </div>
      <span style="font-size:11px;color:var(--textL)">切换角色查看不同视图</span>
    </div>
    <div class="header-right">
      <div style="position:relative;cursor:pointer" onclick="setState('page','notifications')">${icon('bell',18,'var(--textS)')}<div class="notification-dot">3</div></div>
      ${icon('globe',18,'var(--textS)')}
      <div style="display:flex;align-items:center;gap:8px"><div class="avatar">${icon('user',15,'var(--pri)')}</div><span style="font-size:13px;font-weight:500">${roleName}</span></div>
    </div>
  </div>`;

  const pageFn = pages[page] || pages.dashboard;
  document.getElementById('app').innerHTML = `<div class="app">${sidebar}<div class="main">${header}<div class="content">${pageFn()}</div></div></div>`;
}

// Init
render();
</script>
</body>
</html>
