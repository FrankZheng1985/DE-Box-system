# EU-TMS 应用公共配置（root / gzip / 各端 location）
#
# ⚠️ 这份是**线上 `/etc/nginx/snippets/eutms-app.conf` 的副本**，纳入版本管理
#    是为了「重装服务器时这些修复不会丢」。改动流程：
#      1. 改这里 → 2. scp 到 /etc/nginx/snippets/eutms-app.conf
#      3. nginx -t → 4. systemctl reload nginx → 5. 改前后各探一遍逐行 diff
#    **它不会被 CI 自动部署**，改了必须手工同步上去。
#
# ⚠️ 同目录的 `nginx.conf` 已经过时（只有 /admin 和 /customer、没有 /carrier、
#    也不是 snippets 结构），别照着它改，以本文件为准。
# 被 sites-available/germany-box 里的多个 server 块 include，改一处两边同时生效
    root /var/www/germany-box-system/admin/dist;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # API
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /uploads {
        proxy_pass http://backend;
    }

    # ⚠️ 三个门户的 location 必须带**结尾斜杠**。
    #    不带斜杠是前缀匹配：`location /carrier` 会把管理端的 `/carriers`
    #    也一并吃掉，于是「运输公司」页直接输网址或按 F5 就白屏
    #    （页内点击走前端路由看不出来，2026-08-07 实测确认）。
    #    同理 `/admin` 会吃 `/administrators`、`/customer` 会吃 `/customers`——
    #    今天只有 /carriers 撞上，但三处是同一个隐患，一起收口。
    #    带斜杠后这类路径落到最后的 `location /`，交给管理端 SPA，才是对的。
    #
    #    另配 `location = /xxx` 精确匹配，把不带斜杠的裸路径 301 到带斜杠版本，
    #    否则用户输 `/carrier` 会掉进管理端而不是承运商门户。

    # 运营管理端：SPA 部署在**根路径**，不在 /admin 下。
    #   admin/vite.config.ts 是 base:'/'，App.tsx 的路由也全是 /dashboard、/orders
    #   这类无前缀路径，React Router 没设 basename——**没有任何一条 /admin 路由**。
    #   之前这里挂 alias 返回同一份 index.html，于是 /admin/ 能正常加载 SPA、
    #   外壳（侧边栏/顶栏/登录态）全渲染出来，但 pathname 匹配不到任何 Route，
    #   内容区落到兜底显示「页面不存在」——一半正常一半 404，极难看出病因
    #   （2026-08-07 实测确认）。改为一律 301 到根路径版本，旧书签也能跳对。
    location = /admin { return 301 /dashboard; }
    location = /admin/ { return 301 /dashboard; }
    location /admin/ { rewrite ^/admin/(.*)$ /$1 permanent; }

    # ⚠️ 缓存策略：三端 SPA 的 index.html 必须 no-cache，assets 才能长缓存。
    #    index.html 里写死了带 hash 的入口文件名，浏览器把它缓存住 = 部署后
    #    仍去要**上一版**的 chunk；而部署规范里会 `rm -rf assets/*` 清旧资源，
    #    那些 chunk 已经没了，SPA 兜底又把 index.html 当 JS 返回，于是报
    #    「MIME type text/html」白屏。以前这里没写 Cache-Control，走 nginx
    #    默认的启发式缓存，**每次部署都会咬一批人**（2026-08-07 实测确认）。
    #
    #    no-cache 不是不缓存，是每次都拿 ETag 回来验一下，命中就 304，开销极小。
    #    带 hash 的 assets 反过来可以 immutable 永久缓存——文件名变了才是新文件。
    #
    #    assets 的 location 故意**不配 try_files**：找不到就老实 404，
    #    别再返回 index.html 冒充 JS，那会把「资源过期」伪装成「语法错误」。

    # 客户门户
    location = /customer { return 301 /customer/; }
    location /customer/assets/ {
        alias /var/www/germany-box-system/customer-portal/dist/assets/;
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /customer/ {
        alias /var/www/germany-box-system/customer-portal/dist/;
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /customer/index.html;
    }

    # 承运商门户
    location = /carrier { return 301 /carrier/; }
    location /carrier/assets/ {
        alias /var/www/germany-box-system/carrier-portal/dist/assets/;
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /carrier/ {
        alias /var/www/germany-box-system/carrier-portal/dist/;
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /carrier/index.html;
    }

    # 根路径精确匹配 -> 官网主页
    location = / {
        try_files /homepage.html =404;
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # 管理端带 hash 的构建产物（root 已是 admin/dist，不用 alias）
    location /assets/ {
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其他路径 -> 管理端 SPA
    # 注意 no-cache 同时覆盖了 dist 根目录那几个**不带 hash** 的文件
    # （legal.css / legal.js / impressum.html / datenschutz.html / agb.html），
    # 它们改了名字不变，正需要每次验证，别去掉。
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/eutms-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
