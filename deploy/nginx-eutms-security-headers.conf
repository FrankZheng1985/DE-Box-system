# EU-TMS 静态页面安全响应头
#
# 只 include 到静态页面的 location 里，**不要**放进 /api ——
# 后端 Express 的 securityHeaders 中间件已经给 API 加过同名头，
# nginx 再加一份会出现重复头（X-Frame-Options 出现两次时浏览器行为未定义）。
#
# nginx 的 add_header 有继承陷阱：子 location 只要出现一个 add_header，
# 父级的全部 add_header 都会失效。所以这里集中定义、逐个 location include，
# 而不是在 server 级写一遍就指望到处生效。
#
# 2026-08-05 加：此前 nginx 直出的 HTML（/、/login、/admin/、/customer/、
# /carrier/）一个安全头都没有，三个门户的登录页都能被别的站点 iframe 嵌套。

# 防点击劫持。用 SAMEORIGIN 不用 DENY：外部嵌套一样挡住，
# 但不会误伤将来可能出现的同源内嵌需求
add_header X-Frame-Options "SAMEORIGIN" always;

# 禁止浏览器按内容猜 MIME 类型
add_header X-Content-Type-Options "nosniff" always;

# 跨站跳转时只带 origin，不泄露完整路径（路径里可能有订单号等业务信息）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 用不到的浏览器特性直接关掉
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS：一年（2026-08-05 从 max-age=300 调上来）。
# 调之前确认过前提：certbot.timer 每天在跑、证书覆盖 kalunasped.com 与 www、
# certbot renew --dry-run 演练成功 —— 也就是到期能自动续上。
#
# ⚠️ 这一年内浏览器只会用 HTTPS 访问本域名，证书真出问题时用户连继续访问
# 都点不了。所以 certbot 续期失败必须当故障处理，不能拖。
# 应急回退：HSTS 只按域名生效，IP 直访 https://47.83.241.117 不受影响。
#
# 仍然刻意不加 includeSubDomains 和 preload —— 那两个一旦被浏览器或
# 预加载列表记住极难撤回。
add_header Strict-Transport-Security "max-age=31536000" always;

# 没加 Content-Security-Policy：GPS 追踪页从 unpkg CDN 加载 Leaflet，
# SPA 也有内联样式，贸然上 CSP 会直接打破功能。要加得单独做一轮梳理。
